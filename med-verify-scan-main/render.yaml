services:
  - type: web
    name: mediicine-qr-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
      - key: ENFORCE_PASSWORD_POLICY
        value: "false"
      - key: CORS_ORIGINS
        value: "https://gowthamigowthu2005-dotcom.github.io"
      - key: DATABASE_URL
        value: ""
      - key: USE_SQLITE
        value: "true"
    plan: free
